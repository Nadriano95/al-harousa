  <defs>
    <linearGradient id="woodGrad" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#241a12"/>
      <stop offset="50%" stop-color="#3a2a1a"/>
      <stop offset="100%" stop-color="#241a12"/>
    </linearGradient>
    <linearGradient id="woodGradDark" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1a130d"/>
