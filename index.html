<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>AL-HAROUSA — Entrez dans la maison</title>
<meta name="description" content="AL-HAROUSA — Depuis 2005, mobilier, plomberie, quincaillerie, carrelage et décoration à Moroni. Poussez la porte, visitez la maison.">

<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<link rel="icon" type="image/png" sizes="16x16" href="favicon-16.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<meta name="theme-color" content="#0d0c0a">

<meta property="og:type" content="website">
<meta property="og:title" content="AL-HAROUSA — Entrez dans la maison">
<meta property="og:description" content="Depuis 2005, mobilier, plomberie, quincaillerie, carrelage et décoration à Moroni. Poussez la porte, visitez la maison.">
<meta property="og:image" content="hero.jpg">
<meta name="twitter:card" content="summary_large_image">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@400;500;600;700&family=Jost:wght@300;400;500;600&display=swap" rel="stylesheet">

<style>
  :root{
    --black: #0d0c0a;
    --black-soft: #17150f;
    --panel: #211f1c;
    --white: #f7f5f0;
    --white-dim: #e7e3d9;
    --gold: #c9a867;
    --gold-soft: #dcc48f;
    --taupe: #a39b8c;
    --line: rgba(247,245,240,0.16);
    --display: 'Oswald', sans-serif;
    --body: 'Jost', sans-serif;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{
    height:100%;
    background:var(--black);
    color:var(--white);
    font-family:var(--body);
    font-weight:300;
    overflow:hidden;
    -webkit-font-smoothing:antialiased;
  }
  img{display:block;max-width:100%;}
  a{color:inherit;}
  button{font-family:inherit;}
  ::selection{background:var(--gold);color:var(--black);}

  @media (prefers-reduced-motion: reduce){
    *{animation-duration:0.01ms !important; transition-duration:0.01ms !important;}
  }

  /* ============ APP SHELL ============ */
  #app{
    position:relative;
    width:100vw;
    height:100vh;
    height:100dvh;
    overflow:hidden;
  }

  /* ============ DOOR SCREEN ============ */
  #door-screen{
    position:absolute;
    inset:0;
    z-index:50;
    background:
      radial-gradient(ellipse at 50% 38%, #2e2519 0%, #14110c 62%, #0a0908 100%);
    transition:opacity 0.35s ease, visibility 0.35s ease;
  }
  #door-screen::before{
    content:'';
    position:absolute;
    inset:0;
    background-image:
      repeating-linear-gradient(90deg, rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 1px, transparent 1px, transparent 68px);
    opacity:0.5;
  }
  #door-screen.hidden{
    opacity:0;
    visibility:hidden;
    pointer-events:none;
  }
  .door-scene{
    position:absolute;
    top:50%;
    left:50%;
    transform:translate(-50%,-50%);
    width:406px;
    height:667px;
    perspective:2400px;
    filter:drop-shadow(0 30px 70px rgba(0,0,0,0.65));
  }
  .door-leaf{
    position:absolute;
    top:0;
    width:50%;
    height:100%;
    background-size:cover;
    background-repeat:no-repeat;
    transition:transform 1.4s cubic-bezier(.45,0,.2,1), filter 1.4s ease;
    cursor:pointer;
  }
  .door-leaf.l{left:0; background-image:url('door-left.svg'); background-position:right center; transform-origin:left center;}
  .door-leaf.r{left:50%; background-image:url('door-right.svg'); background-position:left center; transform-origin:right center;}
  .door-scene.open .door-leaf.l{transform:rotateY(-112deg); filter:brightness(0.35);}
  .door-scene.open .door-leaf.r{transform:rotateY(112deg); filter:brightness(0.35);}

  .door-overlay{
    position:absolute;
    inset:0;
    z-index:2;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:space-between;
    padding:44px 32px;
    pointer-events:none;
  }
  .door-overlay > *{pointer-events:auto;}
  .door-eyebrow{
    font-family:var(--display);
    font-size:11px;
    letter-spacing:0.32em;
    text-transform:uppercase;
    color:var(--gold);
    text-align:center;
    text-shadow:0 2px 12px rgba(0,0,0,0.8);
  }
  .door-cta{
    font-family:var(--display);
    font-size:13px;
    letter-spacing:0.16em;
    text-transform:uppercase;
    background:var(--gold);
    color:var(--black);
    padding:18px 44px;
    border:none;
    cursor:pointer;
    transition:background .25s ease, transform .25s ease, letter-spacing .25s ease;
    box-shadow:0 8px 30px rgba(0,0,0,0.5);
  }
  .door-cta:hover{background:var(--gold-soft); letter-spacing:0.2em;}
  .door-cta:active{transform:scale(0.97);}
  .door-tagline{
    font-size:13px;
    color:var(--white-dim);
    text-shadow:0 2px 12px rgba(0,0,0,0.9);
    letter-spacing:0.02em;
  }
  .door-hint{
    position:absolute;
    left:0;right:0;
    bottom:9%;
    text-align:center;
    font-family:var(--display);
    font-size:12px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    color:var(--white-dim);
    text-shadow:0 2px 12px rgba(0,0,0,0.8);
    animation:doorPulse 2.2s ease-in-out infinite;
    pointer-events:none;
  }
  @keyframes doorPulse{
    0%,100%{opacity:0.55;}
    50%{opacity:1;}
  }
  .door-skip{
    align-self:flex-end;
    font-family:var(--display);
    font-size:11px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--taupe);
    border-bottom:1px solid transparent;
    padding-bottom:2px;
    transition:color .2s ease, border-color .2s ease;
    text-shadow:0 2px 8px rgba(0,0,0,0.8);
  }
  .door-skip:hover{color:var(--gold); border-color:var(--gold);}

  /* ============ REVEAL SCREEN (behind the door) ============ */
  #reveal-screen{
    position:absolute;
    inset:0;
    z-index:40;
    overflow:hidden;
    opacity:1;
    transition:opacity 0.7s ease;
  }
  #reveal-screen.hidden{
    opacity:0;
    visibility:hidden;
    pointer-events:none;
  }
  .reveal-img{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    transform:scale(1.32);
    filter:blur(4px);
    transition:transform 1.8s cubic-bezier(.2,.7,.2,1), filter 1.8s ease;
  }
  #reveal-screen.zoomed .reveal-img{
    transform:scale(1.05);
    filter:blur(0px);
  }
  .reveal-scrim{
    position:absolute;
    inset:0;
    background:linear-gradient(180deg, rgba(13,12,10,0.45) 0%, rgba(13,12,10,0.55) 55%, rgba(13,12,10,0.85) 100%);
  }
  .reveal-content{
    position:relative;
    z-index:2;
    height:100%;
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:22px;
    padding:32px;
    padding-left:8vw;
    padding-right:38vw;
  }
  .reveal-content .door-eyebrow{margin-bottom:2px;}

  @media (max-width:900px){
    .reveal-content{padding-left:32px; padding-right:32px;}
  }

  /* ============ TOUR ============ */
  #tour{
    position:absolute;
    inset:0;
    opacity:0;
    visibility:hidden;
    transition:opacity 0.6s ease;
  }
  #tour.active{opacity:1; visibility:visible;}

  .room-backdrop{
    position:absolute;
    inset:0;
    overflow:hidden;
  }
  .room-backdrop img{
    position:absolute;
    inset:0;
    width:100%;
    height:100%;
    object-fit:cover;
    transform:scale(1.16);
    filter:blur(10px) brightness(0.7);
    opacity:0;
    transition:transform 1.1s cubic-bezier(.2,.7,.2,1), filter 1.1s cubic-bezier(.2,.7,.2,1), opacity 0.9s ease;
  }
  .room-backdrop.no-photo{
    background:radial-gradient(ellipse at 50% 20%, #241f19 0%, #0d0c0a 75%);
  }
  .room-backdrop::after{
    content:'';
    position:absolute; inset:0;
    background:linear-gradient(180deg, rgba(13,12,10,0.55) 0%, rgba(13,12,10,0.15) 30%, rgba(13,12,10,0.25) 55%, rgba(13,12,10,0.96) 100%);
    z-index:1;
  }
  #tour.walking .room-backdrop img{
    transform:scale(1);
    filter:blur(0px) brightness(0.62);
    opacity:1;
  }

  .room-topbar{
    position:absolute;
    top:0; left:0; right:0;
    z-index:10;
    display:flex;
    align-items:center;
    justify-content:space-between;
    padding:24px 32px;
  }
  .room-logo{
    font-family:var(--display);
    font-weight:600;
    letter-spacing:0.08em;
    font-size:16px;
    text-transform:uppercase;
    cursor:pointer;
  }
  .room-logo span{color:var(--gold);}
  .room-trail{
    display:flex;
    gap:22px;
    list-style:none;
  }
  .room-trail li{
    font-family:var(--display);
    font-size:11px;
    letter-spacing:0.1em;
    text-transform:uppercase;
    color:var(--taupe);
    cursor:pointer;
    padding-bottom:4px;
    border-bottom:1px solid transparent;
    transition:color .25s ease, border-color .25s ease;
    white-space:nowrap;
  }
  .room-trail li:hover{color:var(--white-dim);}
  .room-trail li.current{color:var(--gold); border-color:var(--gold);}
  .trail-toggle{
    display:none;
    background:none;
    border:1px solid var(--line);
    color:var(--white);
    font-size:18px;
    width:38px;height:38px;
    cursor:pointer;
  }

  .room-content{
    position:absolute;
    inset:0;
    z-index:5;
    display:flex;
    flex-direction:column;
    justify-content:flex-end;
    padding:0 32px 30px 100px;
  }
  .room-heading{
    max-width:900px;
    opacity:0;
    transform:translateY(18px);
    transition:opacity 0.7s ease 0.35s, transform 0.7s ease 0.35s;
  }
  #tour.walking .room-heading{opacity:1; transform:translateY(0);}
  .room-eyebrow{
    font-family:var(--display);
    font-size:12px;
    letter-spacing:0.3em;
    text-transform:uppercase;
    color:var(--gold);
    display:flex;
    align-items:center;
    gap:12px;
    margin-bottom:12px;
  }
  .room-eyebrow::before{content:'';width:26px;height:1px;background:var(--gold);}
  .room-title{
    font-family:var(--display);
    font-weight:700;
    text-transform:uppercase;
    font-size:clamp(34px,5.2vw,64px);
    line-height:0.98;
    margin-bottom:10px;
  }
  .room-desc{
    font-size:15px;
    color:var(--white-dim);
    max-width:560px;
    line-height:1.65;
    margin-bottom:22px;
  }

  .room-cards{
    display:flex;
    gap:14px;
    overflow-x:auto;
    padding-bottom:6px;
    scrollbar-width:thin;
    scrollbar-color:var(--gold) transparent;
    opacity:0;
    transform:translateY(18px);
    transition:opacity 0.7s ease 0.55s, transform 0.7s ease 0.55s;
  }
  #tour.walking .room-cards{opacity:1; transform:translateY(0);}
  .room-cards::-webkit-scrollbar{height:5px;}
  .room-cards::-webkit-scrollbar-thumb{background:var(--gold); border-radius:3px;}

  .p-card{
    flex:0 0 auto;
    width:230px;
    background:rgba(23,21,15,0.82);
    backdrop-filter:blur(6px);
    border:1px solid rgba(247,245,240,0.12);
  }
  .p-card-media{
    position:relative;
    aspect-ratio:4/3;
    overflow:hidden;
  }
  .p-card-media img{width:100%;height:100%;object-fit:cover;}
  .p-price{
    position:absolute;
    left:10px;bottom:10px;
    background:var(--gold);
    color:var(--black);
    font-family:var(--display);
    font-weight:600;
    font-size:12.5px;
    padding:5px 10px;
  }
  .p-price.devis{background:transparent;border:1px solid var(--gold-soft);color:var(--gold-soft);}
  .p-body{padding:13px 14px 15px;}
  .p-body h4{
    font-family:var(--display);
    font-size:12.5px;
    letter-spacing:0.03em;
    text-transform:uppercase;
    font-weight:500;
    margin-bottom:5px;
  }
  .p-body p{font-size:12px;color:var(--taupe);line-height:1.5;}

  .svc-card{
    flex:0 0 auto;
    width:200px;
    background:rgba(23,21,15,0.82);
    backdrop-filter:blur(6px);
    border:1px solid rgba(247,245,240,0.12);
    padding:16px;
  }
  .svc-card h4{
    font-family:var(--display);
    font-size:13px;
    letter-spacing:0.03em;
    text-transform:uppercase;
    font-weight:500;
    margin-bottom:6px;
  }
  .svc-card p{font-size:12px;color:var(--taupe);line-height:1.55;}
  .svc-card .partner{
    display:inline-block;margin-top:8px;font-size:9.5px;letter-spacing:0.08em;text-transform:uppercase;
    color:var(--gold-soft);border:1px solid rgba(201,168,103,0.35);padding:3px 8px;
  }

  /* Nav arrows */
  .room-nav{
    position:absolute;
    z-index:15;
    top:50%;
    transform:translateY(-50%);
    width:52px;height:52px;
    border-radius:50%;
    border:1px solid rgba(247,245,240,0.35);
    background:rgba(13,12,10,0.35);
    backdrop-filter:blur(4px);
    color:var(--white);
    font-size:20px;
    display:flex;align-items:center;justify-content:center;
    cursor:pointer;
    transition:background .2s ease, border-color .2s ease, opacity .2s ease;
  }
  .room-nav:hover{border-color:var(--gold); background:rgba(13,12,10,0.6);}
  .room-nav.prev{left:20px;}
  .room-nav.next{right:20px;}
  .room-nav[disabled]{opacity:0; pointer-events:none;}

  .room-advance{
    position:absolute;
    bottom:30px;
    right:32px;
    z-index:15;
    font-family:var(--display);
    font-size:12px;
    letter-spacing:0.14em;
    text-transform:uppercase;
    background:var(--gold);
    color:var(--black);
    padding:14px 26px;
    display:flex;
    align-items:center;
    gap:10px;
    cursor:pointer;
    transition:background .2s ease, transform .2s ease;
    opacity:0;
    transform:translateY(14px);
  }
  #tour.walking .room-advance{opacity:1; transform:translateY(0); transition:opacity 0.7s ease 0.7s, transform 0.7s ease 0.7s, background .2s ease;}
  .room-advance:hover{background:var(--gold-soft);}

  /* progress dots for mobile */
  .room-dots{
    position:absolute;
    bottom:30px;
    left:32px;
    z-index:15;
    display:flex;
    gap:8px;
  }
  .room-dots span{
    width:7px;height:7px;
    border-radius:50%;
    background:rgba(247,245,240,0.3);
    transition:background .3s ease, transform .3s ease;
  }
  .room-dots span.current{background:var(--gold); transform:scale(1.3);}

  /* transition veil */
  .veil{
    position:absolute;
    inset:0;
    background:var(--black);
    z-index:8;
    opacity:0;
    pointer-events:none;
    transition:opacity 0.45s ease;
  }
  .veil.show{opacity:1;}

  /* ============ CONTACT ROOM (special layout) ============ */
  .contact-panel{
    background:rgba(13,12,10,0.86);
    backdrop-filter:blur(8px);
    border:1px solid rgba(247,245,240,0.14);
    padding:26px 28px;
    max-width:460px;
    opacity:0;
    transform:translateY(18px);
    transition:opacity 0.7s ease 0.55s, transform 0.7s ease 0.55s;
  }
  #tour.walking .contact-panel{opacity:1; transform:translateY(0);}
  .contact-panel h3{
    font-family:var(--display);
    text-transform:uppercase;
    font-size:18px;
    margin-bottom:14px;
    font-weight:500;
  }
  .c-field{margin-bottom:13px;}
  .c-field label{
    display:block;font-size:10.5px;letter-spacing:0.08em;text-transform:uppercase;
    color:var(--taupe);margin-bottom:6px;
  }
  .c-field input, .c-field select, .c-field textarea{
    width:100%;background:transparent;border:none;border-bottom:1px solid var(--line);
    color:var(--white);font-family:var(--body);font-size:14px;padding:6px 2px;outline:none;
    transition:border-color .2s ease;
  }
  .c-field input:focus, .c-field select:focus, .c-field textarea:focus{border-color:var(--gold);}
  .c-field select option{background:#211f1c;}
  .c-field textarea{resize:vertical;min-height:50px;}
  .c-submit{
    margin-top:6px;width:100%;text-align:center;background:var(--gold);color:var(--black);
    border:none;font-family:var(--display);font-size:11.5px;letter-spacing:0.12em;text-transform:uppercase;
    padding:13px;cursor:pointer;transition:background .2s ease;
  }
  .c-submit:hover{background:var(--gold-soft);}
  .contact-info{
    display:flex;flex-wrap:wrap;gap:18px;margin-top:16px;
    opacity:0;transform:translateY(18px);
    transition:opacity 0.7s ease 0.4s, transform 0.7s ease 0.4s;
  }
  #tour.walking .contact-info{opacity:1;transform:translateY(0);}
  .contact-info a{
    font-size:13px;color:var(--white-dim);
    border-bottom:1px solid var(--line);padding-bottom:2px;
  }
  .contact-info a:hover{color:var(--gold); border-color:var(--gold);}

  /* ============ RESPONSIVE ============ */
  @media (max-width:900px){
    .room-trail{display:none;}
    .trail-toggle{display:flex; align-items:center; justify-content:center;}
    .room-nav{width:42px;height:42px;font-size:16px;}
    .room-nav.prev{left:10px;}
    .room-nav.next{right:10px;}
    .room-content{padding-left:76px;}
    .room-advance{right:20px; bottom:24px; padding:12px 20px; font-size:11px;}
    .room-dots{left:20px; bottom:26px;}
    .p-card{width:190px;}
    .svc-card{width:170px;}
  }
  @media (max-width:600px){
    .room-title{font-size:clamp(28px,8vw,44px);}
    .room-desc{font-size:13.5px;}
    .room-content{padding:0 18px 22px;}
    .room-cards{margin-bottom:58px;}
    .contact-info{margin-bottom:58px;}
    .room-topbar{padding:18px;}
    .room-nav{display:none;}
    .contact-panel{max-width:100%;padding:20px;}
  }

  .mobile-trail{
    display:none;
    position:absolute;
    top:64px; left:0; right:0;
    z-index:11;
    background:rgba(13,12,10,0.95);
    backdrop-filter:blur(8px);
    padding:14px 20px;
    flex-direction:column;
    gap:14px;
  }
  .mobile-trail.show{display:flex;}
  .mobile-trail li{
    list-style:none;
    font-family:var(--display);
    font-size:13px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:var(--taupe);
  }
  .mobile-trail li.current{color:var(--gold);}
</style>
</head>
<body>

<div id="app">

  <!-- ============ DOOR SCREEN ============ -->
  <div id="door-screen">
    <div class="door-scene" id="doorScene">
      <div class="door-leaf l"></div>
      <div class="door-leaf r"></div>
    </div>
    <div class="door-overlay">
      <span class="door-eyebrow">AL-HAROUSA · Moroni · Depuis 2005</span>
      <span class="door-hint">— Cliquez sur la porte —</span>
      <div class="door-skip" id="skipDoor">Passer l'intro</div>
    </div>
  </div>

  <!-- ============ REVEAL (behind the door) ============ -->
  <div id="reveal-screen" class="hidden">
    <img src="hero.jpg" alt="Salon Al-Harousa" class="reveal-img">
    <div class="reveal-scrim"></div>
    <div class="reveal-content">
      <span class="door-eyebrow">Bienvenue chez Al-Harousa</span>
      <button class="door-cta" id="discoverBtn">Découvrir</button>
      <span class="door-tagline">La visite commence par le salon</span>
    </div>
  </div>

  <!-- ============ TOUR ============ -->
  <div id="tour">
    <div class="veil" id="veil"></div>

    <div class="room-topbar">
      <div class="room-logo" id="logoHome">AL<span>-</span>HAROUSA</div>
      <ul class="room-trail" id="roomTrail"></ul>
      <button class="trail-toggle" id="trailToggle" aria-label="Menu des pièces">☰</button>
    </div>
    <ul class="mobile-trail" id="mobileTrail"></ul>

    <div class="room-backdrop" id="roomBackdrop">
      <img id="roomImg" src="" alt="">
    </div>

    <button class="room-nav prev" id="navPrev" aria-label="Pièce précédente">←</button>
    <button class="room-nav next" id="navNext" aria-label="Pièce suivante">→</button>

    <div class="room-content" id="roomContent">
      <!-- injected per room -->
    </div>

    <div class="room-dots" id="roomDots"></div>
    <div class="room-advance" id="roomAdvance">Avancer →</div>
  </div>

</div>

<script>
/* ======================================================
   AL-HAROUSA — Visite immersive
   ====================================================== */

const $ = (s, r=document) => r.querySelector(s);
const $$ = (s, r=document) => Array.from(r.querySelectorAll(s));

let PRODUCTS = null;
let rooms = [];
let currentIndex = 0;
let isTransitioning = false;

/* ---------- Load product data and build room config ---------- */
async function loadData(){
  const res = await fetch('products.json', {cache:'no-store'});
  PRODUCTS = await res.json();
  buildRooms();
  renderTrail();
  renderRoom(0, false);
}

function buildRooms(){
  const s = PRODUCTS.sections;
  const svc = PRODUCTS.services.items;

  rooms = [
    {
      key:'salon',
      name:'Salon',
      eyebrow:'Première étape',
      title:'Le salon',
      desc:'Canapés, tables basses et compositions murales pour recevoir avec style.',
      image:'hero.jpg',
      items: [...s.canapes.items, ...s.livings.items].map(toCardData)
    },
    {
      key:'chambre',
      name:'Chambre',
      eyebrow:'Deuxième étape',
      title:'La chambre',
      desc:'Lits, chevets et compositions pensés pour un repos serein.',
      image:'chambre-1.jpg',
      items: s.chambres.items.map(toCardData)
    },
    {
      key:'salle-a-manger',
      name:'Salle à manger',
      eyebrow:'Troisième étape',
      title:'La salle à manger',
      desc:'Tables, chaises et buffets assortis pour vos réceptions — et tapis, carrelage pour habiller la pièce.',
      image:'salle-a-manger.jpg',
      items: [
        ...s.finitions.items.filter(i => i.id === 'salle-a-manger').map(toCardData),
        ...s.finitions.items.filter(i => i.id === 'tapis').map(toCardData)
      ]
    },
    {
      key:'salle-de-bain',
      name:'Salle de bain',
      eyebrow:'Quatrième étape',
      title:'Salle de bain & plomberie',
      desc:'Carrelage et installations sanitaires — chaque projet est unique, sur devis.',
      image:null,
      items: [
        ...s.finitions.items.filter(i => i.id === 'carrelage').map(toCardData),
        ...svc.filter(i => i.id === 'plomberie').map(toServiceCardData)
      ]
    },
    {
      key:'univers',
      name:'Autres univers',
      eyebrow:'Cinquième étape',
      title:'Et bien plus encore',
      desc:'Électroménager, mobilier bureautique, vaisselle, toiture et menuiserie — sur devis.',
      image:null,
      items: svc.filter(i => i.id !== 'plomberie').map(toServiceCardData)
    },
    {
      key:'contact',
      name:'Contact',
      eyebrow:'Sortie',
      title:'Vous avez un coup de cœur ?',
      desc:'Contactez-nous pour une demande de devis ou toute question.',
      image:'contact.jpg',
      isContact:true
    }
  ];
}

function toCardData(item){
  return {type:'product', image:item.image, price:item.price, title:item.title, description:item.description};
}
function toServiceCardData(item){
  return {type:'service', title:item.title, description:item.description, partner:item.partner};
}

/* ---------- Render helpers ---------- */
function escapeHtml(str){
  if(str === null || str === undefined) return '';
  return String(str).replace(/[&<>"']/g, m => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));
}

function cardHTML(item){
  if(item.type === 'service'){
    return `
      <div class="svc-card">
        <h4>${escapeHtml(item.title)}</h4>
        <p>${escapeHtml(item.description)}</p>
        ${item.partner ? '<span class="partner">En partenariat</span>' : ''}
      </div>`;
  }
  const priceClass = (item.price && /sur devis/i.test(item.price)) ? 'p-price devis' : 'p-price';
  return `
    <div class="p-card">
      <div class="p-card-media">
        <img src="${escapeHtml(item.image)}" alt="${escapeHtml(item.title)}" loading="lazy">
        ${item.price ? `<span class="${priceClass}">${escapeHtml(item.price)}</span>` : ''}
      </div>
      <div class="p-body">
        <h4>${escapeHtml(item.title)}</h4>
        <p>${escapeHtml(item.description)}</p>
      </div>
    </div>`;
}

function contactHTML(){
  const c = PRODUCTS.site.contact;
  return `
    <div style="display:flex;gap:28px;flex-wrap:wrap;align-items:flex-end;">
      <div class="contact-panel">
        <h3>Demande de devis</h3>
        <form id="quoteForm">
          <div class="c-field"><label>Nom complet</label><input type="text" required></div>
          <div class="c-field"><label>Téléphone / WhatsApp</label><input type="tel" required></div>
          <div class="c-field"><label>Message</label><textarea placeholder="Décrivez votre projet…"></textarea></div>
          <button type="submit" class="c-submit">Envoyer la demande</button>
        </form>
      </div>
    </div>
    <div class="contact-info">
      <a href="tel:${c.phone.replace(/\s/g,'')}">${escapeHtml(c.phone)}</a>
      <a href="mailto:${c.email}">${escapeHtml(c.email)}</a>
      <span style="color:var(--taupe);font-size:13px;">${escapeHtml(c.address)}</span>
    </div>
  `;
}

function renderTrail(){
  const trail = $('#roomTrail');
  const mobileTrail = $('#mobileTrail');
  trail.innerHTML = rooms.map((r,i) => `<li data-index="${i}" class="${i===currentIndex?'current':''}">${escapeHtml(r.name)}</li>`).join('');
  mobileTrail.innerHTML = rooms.map((r,i) => `<li data-index="${i}" class="${i===currentIndex?'current':''}">${escapeHtml(r.name)}</li>`).join('');
  $$('li', trail).forEach(li => li.addEventListener('click', () => goTo(parseInt(li.dataset.index,10))));
  $$('li', mobileTrail).forEach(li => li.addEventListener('click', () => { goTo(parseInt(li.dataset.index,10)); mobileTrail.classList.remove('show'); }));
}

function renderDots(){
  const dots = $('#roomDots');
  dots.innerHTML = rooms.map((r,i) => `<span class="${i===currentIndex?'current':''}"></span>`).join('');
}

function renderRoom(index, animate=true){
  const room = rooms[index];
  const tour = $('#tour');
  const img = $('#roomImg');
  const backdrop = $('#roomBackdrop');
  const content = $('#roomContent');
  const advance = $('#roomAdvance');

  tour.classList.remove('walking');

  backdrop.classList.toggle('no-photo', !room.image);
  if(room.image){
    img.style.display = 'block';
    img.src = room.image;
    img.alt = room.title;
  }else{
    img.style.display = 'none';
  }

  let cardsHtml = '';
  if(room.isContact){
    cardsHtml = contactHTML();
  }else{
    cardsHtml = `<div class="room-cards">${room.items.map(cardHTML).join('')}</div>`;
  }

  content.innerHTML = `
    <div class="room-heading">
      <span class="room-eyebrow">${escapeHtml(room.eyebrow)}</span>
      <h2 class="room-title">${escapeHtml(room.title)}</h2>
      <p class="room-desc">${escapeHtml(room.desc)}</p>
    </div>
    ${cardsHtml}
  `;

  advance.textContent = index === rooms.length - 1 ? 'Revenir au salon ↺' : 'Avancer →';

  $('#navPrev').disabled = index === 0;
  $('#navNext').disabled = index === rooms.length - 1;

  renderDots();
  $$('#roomTrail li').forEach((li,i) => li.classList.toggle('current', i===index));
  $$('#mobileTrail li').forEach((li,i) => li.classList.toggle('current', i===index));

  if(room.isContact){
    const form = $('#quoteForm');
    if(form){
      form.addEventListener('submit', e => {
        e.preventDefault();
        alert('Merci ! Le formulaire n\'est pas encore connecté. Contactez-nous directement par téléphone ou email.');
      });
    }
  }

  // trigger walk-in animation
  requestAnimationFrame(() => {
    requestAnimationFrame(() => {
      tour.classList.add('walking');
    });
  });
}

function goTo(index){
  if(isTransitioning || index === currentIndex || index < 0 || index >= rooms.length) return;
  isTransitioning = true;
  const veil = $('#veil');
  veil.classList.add('show');
  setTimeout(() => {
    currentIndex = index;
    renderRoom(currentIndex);
    setTimeout(() => {
      veil.classList.remove('show');
      isTransitioning = false;
    }, 60);
  }, 420);
}

function next(){
  if(currentIndex === rooms.length - 1){ goTo(0); return; }
  goTo(currentIndex + 1);
}
function prev(){ goTo(currentIndex - 1); }

/* ---------- Door interaction ---------- */
function openDoor(){
  const scene = $('#doorScene');
  const screen = $('#door-screen');
  const revealScreen = $('#reveal-screen');
  if(scene.classList.contains('open')) return;
  scene.classList.add('open');
  setTimeout(() => {
    screen.classList.add('hidden');
    revealScreen.classList.remove('hidden');
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        revealScreen.classList.add('zoomed');
      });
    });
  }, 1350);
}

function enterTour(){
  const revealScreen = $('#reveal-screen');
  const tour = $('#tour');
  revealScreen.classList.add('hidden');
  tour.classList.add('active');
}

$('#doorScene').addEventListener('click', openDoor);
$('#skipDoor').addEventListener('click', (e) => { e.stopPropagation(); openDoor(); });
$('#discoverBtn').addEventListener('click', (e) => { e.stopPropagation(); enterTour(); });

$('#roomAdvance').addEventListener('click', next);
$('#navNext').addEventListener('click', next);
$('#navPrev').addEventListener('click', prev);
$('#logoHome').addEventListener('click', () => goTo(0));
$('#trailToggle').addEventListener('click', () => $('#mobileTrail').classList.toggle('show'));

document.addEventListener('keydown', (e) => {
  if($('#door-screen') && !$('#door-screen').classList.contains('hidden')){
    if(e.key === 'Enter' || e.key === ' ') openDoor();
    return;
  }
  if($('#reveal-screen') && !$('#reveal-screen').classList.contains('hidden')){
    if(e.key === 'Enter' || e.key === ' ') enterTour();
    return;
  }
  if(e.key === 'ArrowRight') next();
  if(e.key === 'ArrowLeft') prev();
});

/* ---------- Reliable door sizing (JS-computed, works on all browsers) ---------- */
function sizeDoor(){
  const scene = $('#doorScene');
  if(!scene) return;
  const DOOR_RATIO = 700 / 1150;
  const vw = window.innerWidth;
  const vh = window.innerHeight;
  const maxW = vw * 0.92;
  const maxH = vh * 0.92;
  let w = maxH * DOOR_RATIO;
  let h = maxH;
  if(w > maxW){
    w = maxW;
    h = maxW / DOOR_RATIO;
  }
  scene.style.width = Math.round(w) + 'px';
  scene.style.height = Math.round(h) + 'px';
}
sizeDoor();
window.addEventListener('resize', sizeDoor);
window.addEventListener('orientationchange', sizeDoor);

loadData();
</script>

</body>
</html>
